<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Restaurante</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #333;
            --accent-red: #ff5252;
            --accent-green: #4CAF50;
            --text-color: #e0e0e0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; 
            padding: 20px; 
        }

        .main-container { 
            max-width: 1100px; 
            margin: auto; 
        }

        h1 { 
            color: var(--accent-red); 
            text-align: center; 
            font-size: 1.8rem; 
            margin-bottom: 25px; 
        }

        /* ESTRUTURA DIVIDIDA EM DUAS COLUNAS */
        .painel-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .painel-grid {
                grid-template-columns: 1fr; /* No celular fica um abaixo do outro */
            }
        }

        .card-secao {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        h2 { 
            color: var(--accent-red); 
            font-size: 1.2rem; 
            margin-top: 0; 
            margin-bottom: 20px; 
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }
        
        input, button { 
            padding: 12px; 
            margin: 8px 0; 
            width: 100%; 
            box-sizing: border-box; 
            border-radius: 6px; 
            border: none; 
            font-size: 1rem; 
        }
        
        input { 
            background: #2a2a2a; 
            color: white; 
            border: 1px solid #444; 
        }

        input:focus {
            border-color: var(--accent-green);
            outline: none;
        }

        button { 
            background-color: var(--accent-green); 
            color: white; 
            cursor: pointer; 
            font-weight: bold; 
            transition: opacity 0.2s;
        }

        button:hover { 
            opacity: 0.9; 
        }

        .btn-atualizar {
            background-color: #ff9800;
            margin-bottom: 15px;
        }

        /* ESTILO DOS PEDIDOS NO BALCÃO */
        .lista-pedidos {
            max-height: 450px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .pedido-item {
            background: #252525;
            border: 1px solid #444;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 5px solid var(--accent-green);
        }

        .pedido-item p {
            margin: 4px 0;
            font-size: 0.95rem;
        }

        .codigo-destaque {
            color: #ffcc00;
            font-weight: bold;
            font-size: 1.05rem;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            background: #333;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="main-container">
    <h1>🍔 Painel do Restaurante</h1>
    
    <div class="painel-grid">
        
        <!-- COLUNA DA ESQUERDA: CRIAR PEDIDO -->
        <div class="card-secao">
            <h2>Criar Novo Pedido</h2>
            <input type="text" id="cliente" placeholder="Nome do Cliente">
            <input type="text" id="endereco" placeholder="Endereço de Entrega">
            <input type="number" id="distancia" placeholder="Distância em KM (Ex: 3)">
            <button onclick="criarPedido()">Fazer Pedido</button>
        </div>

        <!-- COLUNA DA DIREITA: PEDIDOS NO BALCÃO -->
        <div class="card-secao">
            <h2>Pedidos no Balcão</h2>
            <button class="btn-atualizar" onclick="carregarPedidos()">Atualizar Coletas</button>
            <div id="lista-pedidos" class="lista-pedidos">
                <p style="text-align: center; color: #777;">Carregando pedidos...</p>
            </div>
        </div>

    </div>
</div>

<script>
    const API_URL = window.location.origin;

    async function criarPedido() {
        const cliente = document.getElementById('cliente').value;
        const enderecoEntrega = document.getElementById('endereco').value;
        const distanciaKm = document.getElementById('distancia').value;

        if (!cliente || !enderecoEntrega || !distanciaKm) {
            alert("Por favor, preencha todos os campos!");
            return;
        }

        const res = await fetch(`${API_URL}/pedidos`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cliente, enderecoEntrega, distanciaKm })
        });

        const json = await res.json();
        if (res.ok) {
            alert("Pedido criado e enviado para os motoboys com sucesso!");
            document.getElementById('cliente').value = '';
            document.getElementById('endereco').value = '';
            document.getElementById('distancia').value = '';
            carregarPedidos();
        } else {
            alert(json.erro);
        }
    }

    async function carregarPedidos() {
        // Se o usuário estiver focado em qualquer input, bloqueia totalmente o recarregamento automático da tela
        const elementoAtivo = document.activeElement;
        if (elementoAtivo && (elementoAtivo.tagName === 'INPUT' || elementoAtivo.tagName === 'TEXTAREA')) {
            return;
        }

        try {
            const res = await fetch(`${API_URL}/restaurante/pedidos`);
            const pedidos = await res.json();

            let html = '';
            if (pedidos.length === 0) {
                html = '<p style="color:#777; text-align:center;">Nenhum pedido no momento.</p>';
            } else {
                pedidos.slice().reverse().forEach(p => {
                    html += `
                        <div class="pedido-item">
                            <p><strong>Pedido #${p.id}</strong> - ${p.cliente}</p>
                            <p>Status: <span class="status-badge">${p.status}</span></p>
                            <p>🔑 Código de Coleta: <span class="codigo-destaque">${p.codigoColetaParaValidar || '---'}</span></p>
                            <p>🔒 Código do Cliente: <span class="codigo-destaque" style="color: #4CAF50;">${p.codigoEntregaParaValidar || '---'}</span></p>
                        </div>
                    `;
                });
            }

            // Só atualiza se o conteúdo realmente mudou ou se o container estiver vazio, evitando piscadas desnecessárias
            const container = document.getElementById('lista-pedidos');
            if (container.innerHTML !== html) {
                container.innerHTML = html;
            }
        } catch (e) {
            console.log("Erro ao carregar pedidos", e);
        }
    }

    // Intervalo ajustado para 6 segundos para dar mais respiro ao celular
    setInterval(carregarPedidos, 6000);
    carregarPedidos();
</script>

</body>
</html>
