<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Restaurante (Admin)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1, h2 { color: #ff5252; text-align: center; }
        .secao { margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        input, button, select { padding: 12px; margin: 6px 0; width: 100%; box-sizing: border-box; border-radius: 6px; border: none; font-size: 1rem; }
        input, select { background: #333; color: white; border: 1px solid #555; }
        button { background-color: #ff5252; color: white; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .card { background: #2d2d2d; border: 1px solid #444; padding: 15px; margin-bottom: 12px; border-radius: 8px; }
        .btn-acao { background-color: #4CAF50; width: auto; padding: 8px 15px; margin-right: 5px; font-size: 0.9rem; }
        .btn-bloquear { background-color: #f44336; width: auto; padding: 8px 15px; font-size: 0.9rem; }
        .btn-desbloquear { background-color: #2196F3; width: auto; padding: 8px 15px; font-size: 0.9rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #444; font-size: 0.95rem; }
        th { background-color: #252525; color: #ff5252; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍔 Painel do Restaurante (Admin)</h1>

    <div class="secao">
        <h2>🛵 Motoboys Cadastrados</h2>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Usuário</th>
                        <th>Conexão</th>
                        <th>Status da Conta</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-motoboys">
                    <tr><td colspan="5" style="text-align:center; color:#777;">Carregando motoboys...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="secao">
        <h2>📝 Cadastrar Novo Pedido</h2>
        <input type="text" id="cliente" placeholder="Nome do Cliente">
        <input type="text" id="enderecoEntrega" placeholder="Endereço de Entrega (Ex: Rua das Flores, 50)">
        <input type="number" id="distanciaKm" placeholder="Distância em KM (Ex: 3.5)">
        <button onclick="cadastrarPedido()">Lançar Pedido para Entrega</button>
    </div>

    <div class="secao">
        <h2>📦 Acompanhamento de Pedidos</h2>
        <div id="lista-pedidos">Carregando pedidos...</div>
    </div>
</div>

<script>
    const API_URL = window.location.origin;

    async function carregarMotoboys() {
        try {
            const res = await fetch(`${API_URL}/admin/motoboys`);
            const motoboys = await res.json();
            let html = '';

            if (motoboys.length === 0) {
                html = '<tr><td colspan="5" style="text-align:center; color:#777;">Nenhum motoboy cadastrado.</td></tr>';
            } else {
                motoboys.forEach(m => {
                    const statusConexao = m.online ? '<span style="color:#4CAF50; font-weight:bold;">🟢 Online</span>' : '<span style="color:#777;">🔴 Offline</span>';
                    const statusConta = m.ativo ? '<span style="color:#4CAF50;">Ativo</span>' : '<span style="color:#f44336; font-weight:bold;">Temporariamente Bloqueado</span>';
                    
                    html += `
                        <tr>
                            <td>${m.nome}</td>
                            <td>${m.usuario}</td>
                            <td>${statusConexao}</td>
                            <td>${statusConta}</td>
                            <td>
                                ${m.ativo ? 
                                    `<button class="btn-bloquear" onclick="alterarStatusMotoboy(${m.id}, false)">Bloquear (5 min)</button>` : 
                                    `<button class="btn-desbloquear" onclick="alterarStatusMotoboy(${m.id}, true)">Desbloquear</button>`
                                }
                            </td>
                        </tr>
                    `;
                });
            }
            document.getElementById('tabela-motoboys').innerHTML = html;
        } catch (e) {
            console.log("Erro ao carregar motoboys", e);
        }
    }

    async function alterarStatusMotoboy(id, ativo) {
        try {
            const res = await fetch(`${API_URL}/admin/motoboys/${id}/status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ativo })
            });
            if (res.ok) {
                carregarMotoboys();
            } else {
                alert("Erro ao alterar status do motoboy.");
            }
        } catch(e) {
            alert("Erro de conexão ao alterar status.");
        }
    }

    async function cadastrarPedido() {
        const cliente = document.getElementById('cliente').value;
        const enderecoEntrega = document.getElementById('enderecoEntrega').value;
        const distanciaKm = document.getElementById('distanciaKm').value;

        const res = await fetch(`${API_URL}/pedidos`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cliente, enderecoEntrega, distanciaKm })
        });
        const json = await res.json();
        if (res.ok) {
            alert("Pedido lançado com sucesso!");
            document.getElementById('cliente').value = '';
            document.getElementById('enderecoEntrega').value = '';
            document.getElementById('distanciaKm').value = '';
            carregarPedidos();
        } else {
            alert(json.erro);
        }
    }

    // Função para definir a cor do status na tela
    function corStatus(status) {
        if (status === 'Entregue') return '#4CAF50'; // Verde
        if (status === 'Em Trânsito') return '#FFEB3B'; // Amarelo
        if (status && status.includes('Cancelado')) return '#F44336'; // Vermelho
        return '#ff9800'; // Laranja padrão para etapas intermediárias
    }

    async function carregarPedidos() {
        const res = await fetch(`${API_URL}/restaurante/pedidos`);
        const pedidos = await res.json();
        let html = '';

        if (pedidos.length === 0) {
            html = '<p style="color:#777; text-align:center;">Nenhum pedido no momento.</p>';
        } else {
            pedidos.forEach(p => {
                let nomeMotoboyExibicao = p.motoboyNome ? p.motoboyNome : '<span style="color:#777;">Aguardando aceite...</span>';
                if (p.status === 'Cancelado pelo Motoboy' && p.motoboyNome) {
                    nomeMotoboyExibicao = `<span style="color:#F44336; font-weight:bold;">${p.motoboyNome} (Cancelou)</span>`;
                }

                html += `
                    <div class="card">
                        <p><strong>Pedido #${p.id}</strong> - Cliente: <strong style="color:#ffcc00;">${p.cliente}</strong></p>
                        <p>📍 <strong>Entrega:</strong> ${p.enderecoEntrega}</p>
                        <p>🛵 <strong>Motoboy:</strong> ${nomeMotoboyExibicao}</p>
                        <p>📌 <strong>Status Atual:</strong> <span style="color: ${corStatus(p.status)}; font-weight:bold;">${p.status}</span></p>
                        
                        <div style="background:#222; padding: 10px; border-radius: 5px; margin-top: 10px;">
                            <p style="margin: 0 0 5px 0; font-size: 0.85rem; color: #aaa;">Códigos de Validação:</p>
                            <span style="background:#333; padding: 4px 8px; border-radius: 4px; font-size: 0.9rem; margin-right: 10px;">🔑 Coleta: <strong>${p.codigoColetaParaValidar}</strong></span>
                            <span style="background:#333; padding: 4px 8px; border-radius: 4px; font-size: 0.9rem;">🎯 Entrega: <strong>${p.codigoEntregaParaValidar}</strong></span>
                        </div>

                        ${p.status === 'Aguardando Chegada ao Restaurante' || p.status === 'Motoboy Chegou no Restaurante' ? `
                            <button class="btn-acao" style="margin-top: 10px;" onclick="produtoPronto(${p.id})">✅ Produto Pronto no Balcão</button>
                        ` : ''}
                    </div>
                `;
            });
        }
        document.getElementById('lista-pedidos').innerHTML = html;
    }

    async function produtoPronto(id) {
        const res = await fetch(`${API_URL}/pedidos/${id}/produto-pronto`, { method: 'POST' });
        if (res.ok) {
            carregarPedidos();
        } else {
            alert("Erro ao atualizar status do pedido.");
        }
    }

    function iniciarAtualizacao() {
        setInterval(() => {
            carregarMotoboys();
            carregarPedidos();
        }, 4000);
        carregarMotoboys();
        carregarPedidos();
    }

    iniciarAtualizacao();
</script>

</body>
</html>
