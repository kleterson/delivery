<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Restaurante (Admin)</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        
        .container { max-width: 1300px; margin: auto; }
        h1 { color: #ff5252; text-align: center; margin-bottom: 25px; }

        /* Estilo do Dashboard / KPIs no topo */
        .dashboard-topo {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .dash-card {
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .dash-card h3 { margin: 0; font-size: 0.9rem; color: #aaa; }
        .dash-card p { margin: 8px 0 0 0; font-size: 1.5rem; font-weight: bold; color: #ff5252; }
        
        /* Layout de Tela Dividida (Grid) */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .dashboard-topo { grid-template-columns: 1fr; }
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        .coluna {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .secao { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        h2 { color: #ff5252; font-size: 1.2rem; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        input, button, select { padding: 10px 12px; margin: 6px 0; width: 100%; border-radius: 6px; border: none; font-size: 0.95rem; }
        input, select { background: #2d2d2d; color: white; border: 1px solid #444; }
        button { background-color: #ff5252; color: white; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }
        
        .card { background: #2d2d2d; border: 1px solid #444; padding: 15px; margin-bottom: 12px; border-radius: 8px; }
        .card p { margin: 6px 0; }
        
        .btn-acao { background-color: #4CAF50; width: auto; padding: 8px 15px; margin-right: 5px; font-size: 0.85rem; }
        .btn-bloquear { background-color: #f44336; width: auto; padding: 6px 12px; font-size: 0.8rem; }
        .btn-desbloquear { background-color: #2196F3; width: auto; padding: 6px 12px; font-size: 0.8rem; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #444; font-size: 0.85rem; }
        th { background-color: #252525; color: #ff5252; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍔 Painel do Restaurante (Admin)</h1>

    <!-- DASHBOARD DE INDICADORES NO TOPO -->
    <div class="dashboard-topo">
        <div class="dash-card">
            <h3>🛵 Motoboys Online</h3>
            <p id="dash-motoboys-online">0</p>
        </div>
        <div class="dash-card">
            <h3>📦 Pedidos Ativos</h3>
            <p id="dash-pedidos-ativos">0</p>
        </div>
        <div class="dash-card">
            <h3>✅ Entregues Hoje</h3>
            <p id="dash-pedidos-entregues">0</p>
        </div>
    </div>

    <div class="dashboard-grid">
        <!-- COLUNA ESQUERDA: Motoboys e Cadastros -->
        <div class="coluna">
            <div class="secao">
                <h2>📝 Cadastrar Novo Pedido</h2>
                <input type="text" id="cliente" placeholder="Nome do Cliente">
                <input type="text" id="enderecoEntrega" placeholder="Endereço ou Bairro (Ex: Rua Tenente José dos Santos, 1272 - Catiapoã)">
                <input type="number" step="0.1" id="distanciaKm" placeholder="Distância em KM (Calculado automático ou digite)">
                <button onclick="cadastrarPedido()">Lançar Pedido para Entrega</button>
            </div>

            <div class="secao">
                <h2>🛵 Motoboys Cadastrados</h2>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Conexão</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-motoboys">
                            <tr><td colspan="4" style="text-align:center; color:#777;">Carregando motoboys...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- COLUNA DIREITA: Acompanhamento de Pedidos -->
        <div class="coluna">
            <div class="secao" style="flex: 1;">
                <h2>📦 Acompanhamento de Pedidos</h2>
                <div id="lista-pedidos">Carregando pedidos...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = window.location.origin;

    // Coordenadas base do restaurante (Centro / São Vicente) - pode ajustar se precisar
    const RESTAURANTE_LAT = -23.9665;
    const RESTAURANTE_LON = -46.3845;

    // Tabela local instantânea de bairros e ruas principais de São Vicente (sem bloqueio de internet/CORS)
    const LOCAIS_SAO_VICENTE = [
        { palavras: ["centro", "martim afonso", "capitao mor aguiar", "capitao-mor aguiar", "freitas guimaraes", "jacob emerick", "joao ramalho", "messia assu", "prefeito jose monteiro"], lat: -23.9665, lon: -46.3845 },
        { palavras: ["gonzaguinha", "antonio rodrigues", "embaixador pedro de toledo", "22 de janeiro", "binario"], lat: -23.9718, lon: -46.3812 },
        { palavras: ["itarare", "ayrton senna", "presidente wilson", "boa vista", "ilporanga", "teleferico"], lat: -23.9695, lon: -46.3688 },
        { palavras: ["catiapoa", "tenente jose dos santos", "jose tenente dos santos", "padre anchieta", "newton prado", "mascarente de moraes", "mascarenhas de moraes"], lat: -23.9585, lon: -46.3820 },
        { palavras: ["vila valenca", "valenca", "expedicionarios", "campos sales", "benjamin constant"], lat: -23.9620, lon: -46.3775 },
        { palavras: ["vila cascatinha", "cascatinha", "saldanha da gama"], lat: -23.9560, lon: -46.3740 },
        { palavras: ["parque bilar", "bilar", "parque sao vicente", "sao vicente", "tamoios", "guarani"], lat: -23.9590, lon: -46.3935 },
        { palavras: ["vila margarida", "margarida", "mexico", "polidoro de oliveira", "esplanada dos barreiros", "barreiros"], lat: -23.9640, lon: -46.4050 },
        { palavras: ["jockey", "jockey club", "hipodromo", "antonio emerich"], lat: -23.9515, lon: -46.3885 },
        { palavras: ["nautica", "cidade nautica", "tancredo neves", "lourival moreira"], lat: -23.9535, lon: -46.4045 },
        { palavras: ["vila voturua", "voturua", "tupiniquins"], lat: -23.9505, lon: -46.3735 },
        { palavras: ["japui", "ponte pensil", "itaquitanduva"], lat: -23.9815, lon: -46.3910 },
        { palavras: ["parque das bandeiras", "bandeiras", "samarita", "humaita", "quarentenario", "rio branco", "jardim rio branco", "gleba"], lat: -23.9650, lon: -46.4550 }
    ];

    function normalizarTexto(txt) {
        return txt.toLowerCase()
            .normalize("NFD")
            .replace(/[̀-ͯ]/g, "")
            .trim();
    }

    // Fórmula de Haversine + fator de rota urbana (1.35x) para distância real pelas ruas
    function calcularKmHaversine(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        const distanciaReta = R * c;
        const distanciaRuas = Math.max(1.0, distanciaReta * 1.35);
        return distanciaRuas.toFixed(1);
    }

    function calcularDistanciaAutomatica() {
        const enderecoInput = document.getElementById('enderecoEntrega');
        const distanciaInput = document.getElementById('distanciaKm');
        const texto = normalizarTexto(enderecoInput.value);

        if (!texto) return;

        // 1. Procura na tabela local instantânea (0ms, funciona sempre)
        for (const local of LOCAIS_SAO_VICENTE) {
            for (const palavra of local.palavras) {
                if (texto.includes(palavra)) {
                    distanciaInput.value = calcularKmHaversine(RESTAURANTE_LAT, RESTAURANTE_LON, local.lat, local.lon);
                    return;
                }
            }
        }

        // 2. Se digitar um CEP (ex: 11320-000 ou 11320000), consulta via BrasilAPI / AwesomeAPI (sem bloqueio CORS)
        const cepMatch = texto.match(/ (\d{5})-?(\d{3}) /);
        if (cepMatch) {
            const cep = cepMatch[1] + cepMatch[2];
            fetch(`https://cep.awesomeapi.com.br/json/${cep}`)
                .then(r => r.json())
                .then(dados => {
                    if (dados && dados.lat && dados.lng) {
                        distanciaInput.value = calcularKmHaversine(RESTAURANTE_LAT, RESTAURANTE_LON, parseFloat(dados.lat), parseFloat(dados.lng));
                    }
                })
                .catch(() => {});
        }
    }

    // Calcula em tempo real enquanto digita e também ao sair do campo
    document.getElementById('enderecoEntrega').addEventListener('input', calcularDistanciaAutomatica);
    document.getElementById('enderecoEntrega').addEventListener('blur', calcularDistanciaAutomatica);

    function formatarTempo(segundos) {
        const min = Math.floor(segundos / 60);
        const seg = segundos % 60;
        return `${min.toString().padStart(2, '0')}:${seg.toString().padStart(2, '0')}`;
    }

    async function carregarMotoboys() {
        try {
            const res = await fetch(`${API_URL}/admin/motoboys`);
            const motoboys = await res.json();
            let html = '';
            let onlineCount = 0;

            const agora = Date.now();

            if (motoboys.length === 0) {
                html = '<tr><td colspan="4" style="text-align:center; color:#777;">Nenhum motoboy cadastrado.</td></tr>';
            } else {
                motoboys.forEach(m => {
                    if (m.online) onlineCount++;
                    const statusConexao = m.online ? '<span style="color:#4CAF50; font-weight:bold;">🟢 Online</span>' : '<span style="color:#777;">🔴 Offline</span>';
                    
                    let statusConta = '<span style="color:#4CAF50;">Ativo</span>';
                    if (!m.ativo || agora < m.tempoBloqueioAte) {
                        const segundosRestantes = Math.ceil((m.tempoBloqueioAte - agora) / 1000);
                        if (segundosRestantes > 0) {
                            statusConta = `<span style="color:#f44336; font-weight:bold;">Bloqueado (${formatarTempo(segundosRestantes)})</span>`;
                        } else {
                            statusConta = '<span style="color:#f44336; font-weight:bold;">Temporariamente Bloqueado</span>';
                        }
                    }
                    
                    html += `
                        <tr>
                            <td><strong>${m.nome}</strong></td>
                            <td>${statusConexao}</td>
                            <td>${statusConta}</td>
                            <td>
                                ${m.ativo && agora >= (m.tempoBloqueioAte || 0) ? 
                                    `<button class="btn-bloquear" onclick="alterarStatusMotoboy(${m.id}, false)">Bloquear</button>` : 
                                    `<button class="btn-desbloquear" onclick="alterarStatusMotoboy(${m.id}, true)">Desbloquear</button>`
                                }
                            </td>
                        </tr>
                    `;
                });
            }
            document.getElementById('tabela-motoboys').innerHTML = html;
            document.getElementById('dash-motoboys-online').innerText = onlineCount;
        } catch (e) {
            console.log("Erro ao carregar motoboys", e);
        }
    }

    async function alterarStatusMotoboy(id, ativo) {
        try {
            const res = await fetch(`${API_URL}/admin/motoboys/${id}/status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ativo })
            });
            if (res.ok) {
                carregarMotoboys();
            } else {
                alert("Erro ao alterar status do motoboy.");
            }
        } catch(e) {
            alert("Erro de conexão ao alterar status.");
        }
    }

    async function cadastrarPedido() {
        const cliente = document.getElementById('cliente').value;
        const enderecoEntrega = document.getElementById('enderecoEntrega').value;
        let distanciaKm = document.getElementById('distanciaKm').value;

        if (!distanciaKm) {
            calcularDistanciaAutomatica();
            distanciaKm = document.getElementById('distanciaKm').value;
        }

        if (!distanciaKm) {
            alert("Bairro/rua não reconhecido automaticamente. Inclua o nome do bairro no endereço (ex: Catiapoã, Centro, Itararé, Vila Margarida) ou digite o KM manualmente.");
            return;
        }

        const res = await fetch(`${API_URL}/pedidos`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cliente, enderecoEntrega, distanciaKm })
        });
        const json = await res.json();
        if (res.ok) {
            document.getElementById('cliente').value = '';
            document.getElementById('enderecoEntrega').value = '';
            document.getElementById('distanciaKm').value = '';
            carregarPedidos();
        } else {
            alert(json.erro);
        }
    }

    function corStatus(status) {
        if (status === 'Entregue') return '#4CAF50'; 
        if (status === 'Em Trânsito') return '#FFEB3B'; 
        if (status && status.includes('Cancelado')) return '#F44336'; 
        return '#ff9800'; 
    }

    async function carregarPedidos() {
        const res = await fetch(`${API_URL}/restaurante/pedidos`);
        const pedidos = await res.json();
        let html = '';
        let ativosCount = 0;
        let entreguesCount = 0;

        if (pedidos.length === 0) {
            html = '<p style="color:#777; text-align:center;">Nenhum pedido no momento.</p>';
        } else {
            // Inverte a lista para exibir os pedidos mais recentes no topo
            const pedidosInvertidos = [...pedidos].reverse();

            pedidosInvertidos.forEach(p => {
                if (p.status === 'Entregue') {
                    entreguesCount++;
                } else if (!p.status.includes('Cancelado')) {
                    ativosCount++;
                }

                let nomeMotoboyExibicao = p.motoboyNome ? p.motoboyNome : '<span style="color:#777;">Aguardando aceite...</span>';
                if (p.status === 'Cancelado pelo Motoboy' && p.motoboyNome) {
                    nomeMotoboyExibicao = `<span style="color:#F44336; font-weight:bold;">${p.motoboyNome} (Cancelou)</span>`;
                }

                html += `
                    <div class="card">
                        <p><strong>Pedido #${p.id}</strong> - Cliente: <strong style="color:#ffcc00;">${p.cliente}</strong></p>
                        <p>📍 <strong>Entrega:</strong> ${p.enderecoEntrega}</p>
                        <p>🛵 <strong>Motoboy:</strong> ${nomeMotoboyExibicao}</p>
                        <p>📌 <strong>Status:</strong> <span style="color: ${corStatus(p.status)}; font-weight:bold;">${p.status}</span></p>
                        
                        <div style="background:#222; padding: 8px; border-radius: 5px; margin-top: 8px; font-size: 0.85rem;">
                            <span style="margin-right: 15px;">🔑 Coleta: <strong>${p.codigoColetaParaValidar}</strong></span>
                            <span>🎯 Entrega: <strong>${p.codigoEntregaParaValidar}</strong></span>
                        </div>

                        ${p.status === 'Aguardando Chegada ao Restaurante' || p.status === 'Motoboy Chegou no Restaurante' ? `
                            <button class="btn-acao" style="margin-top: 8px;" onclick="produtoPronto(${p.id})">✅ Produto Pronto no Balcão</button>
                        ` : ''}
                    </div>
                `;
            });
        }
        document.getElementById('lista-pedidos').innerHTML = html;
        document.getElementById('dash-pedidos-ativos').innerText = ativosCount;
        document.getElementById('dash-pedidos-entregues').innerText = entreguesCount;
    }

    async function produtoPronto(id) {
        const res = await fetch(`${API_URL}/pedidos/${id}/produto-pronto`, { method: 'POST' });
        if (res.ok) {
            carregarPedidos();
        } else {
            alert("Erro ao atualizar status do pedido.");
        }
    }

    function iniciarAtualizacao() {
        setInterval(() => {
            carregarMotoboys();
            carregarPedidos();
        }, 1000);
        carregarMotoboys();
        carregarPedidos();
    }

    iniciarAtualizacao();
</script>

</body>
</html>
