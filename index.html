<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App do Motoboy - Login</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 15px; }
        .container { max-width: 480px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1, h2 { color: #ff5252; text-align: center; font-size: 1.4rem; }
        
        .painel-saldo { background: #252525; border: 2px solid #4CAF50; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        .painel-saldo h3 { margin: 0; color: #aaa; font-size: 0.9rem; text-transform: uppercase; }
        .painel-saldo p { margin: 5px 0 0 0; color: #4CAF50; font-size: 1.8rem; font-weight: bold; }

        .card { background: #2d2d2d; border: 1px solid #444; padding: 15px; margin-bottom: 12px; border-radius: 8px; }
        .card-alerta { border: 2px solid #ff5252; background: #2c1a1a; animation: piscar 0.8s infinite alternate; }
        @keyframes piscar { from { border-color: #ff5252; } to { border-color: #ff9800; } }
        
        input, button { padding: 12px; margin: 6px 0; width: 100%; box-sizing: border-box; border-radius: 6px; border: none; font-size: 1rem; }
        input { background: #333; color: white; border: 1px solid #555; }
        button { background-color: #4CAF50; color: white; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }
        
        .btn-recusar { background-color: #f44336; }
        .btn-aceitar { background-color: #2196F3; }
        .btn-historico { background-color: #607D8B; margin-top: 20px; }
        .btn-sair { background-color: #d32f2f; margin-top: 10px; }
        .badge { background: #ff5252; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; }
        
        #modal-historico { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-conteudo { background: #1e1e1e; width: 100%; max-width: 450px; max-height: 80vh; overflow-y: auto; padding: 20px; border-radius: 10px; border: 1px solid #555; }
        .auth-box { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛵 App do Motoboy</h1>

    <!-- TELA DE LOGIN / CADASTRO -->
    <div id="tela-auth" class="auth-box" style="display: block;">
        <div id="form-login">
            <h2>Entrar na Conta</h2>
            <input type="text" id="login-usuario" placeholder="Usuário">
            <input type="password" id="login-senha" placeholder="Senha">
            <button onclick="fazerLogin()">Entrar</button>
            <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">Não tem cadastro? <a href="#" onclick="alternarTelaAuth('cadastro')" style="color: #4CAF50;">Cadastre-se</a></p>
        </div>

        <div id="form-cadastro" style="display: none;">
            <h2>Criar Nova Conta</h2>
            <input type="text" id="cad-nome" placeholder="Seu Nome Completo">
            <input type="text" id="cad-usuario" placeholder="Criar Usuário">
            <input type="password" id="cad-senha" placeholder="Criar Senha">
            <button onclick="fazerCadastro()" style="background-color: #ff9800;">Cadastrar</button>
            <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">Já tem conta? <a href="#" onclick="alternarTelaAuth('login')" style="color: #4CAF50;">Faça Login</a></p>
        </div>
    </div>

    <!-- TELA PRINCIPAL DO APLICATIVO (APÓS LOGIN) -->
    <div id="tela-app" style="display: none;">
        <p id="saudacao-motoboy" style="text-align: center; color: #4CAF50; font-weight: bold;"></p>

        <div class="painel-saldo">
            <h3>Seu Saldo Acumulado</h3>
            <p id="saldo-total">R$ 0,00</p>
        </div>

        <div id="aviso-audio" style="background: #2a2a1a; border: 1px solid #ff9800; padding: 12px; border-radius: 6px; margin-bottom: 15px; text-align: center; font-size: 0.9rem; color: #ffcc00; cursor: pointer;" onclick="ativarAppCompleto()">
            🔔 Toque aqui para habilitar o Alarme e Notificações
        </div>

        <div id="motoboy-painel">Procurando entregas...</div>

        <button class="btn-historico" onclick="abrirHistorico()">Ver Entregas Realizadas</button>
        <button class="btn-sair" onclick="fazerLogout()">Sair da Conta</button>
    </div>
</div>

<div id="modal-historico">
    <div class="modal-conteudo">
        <h2>Suas Entregas Realizadas</h2>
        <div id="lista-historico">Carregando...</div>
        <button onclick="fecharHistorico()" style="background-color: #f44336; margin-top: 15px;">Fechar</button>
    </div>
</div>

<script>
    const API_URL = window.location.origin;
    let audioInterval = null;
    let audioCtx = null;
    let ultimoPedidoNotificado = null;
    let motoboyLogado = JSON.parse(localStorage.getItem('motoboy_logado')) || null;

    function verificarSessao() {
        if (motoboyLogado) {
            document.getElementById('tela-auth').style.display = 'none';
            document.getElementById('tela-app').style.display = 'block';
            document.getElementById('saudacao-motoboy').innerText = `Olá, ${motoboyLogado.nome} 🛵`;
            iniciarLoopApp();
        } else {
            document.getElementById('tela-auth').style.display = 'block';
            document.getElementById('tela-app').style.display = 'none';
        }
    }

    function alternarTelaAuth(tipo) {
        if (tipo === 'cadastro') {
            document.getElementById('form-login').style.display = 'none';
            document.getElementById('form-cadastro').style.display = 'block';
        } else {
            document.getElementById('form-cadastro').style.display = 'none';
            document.getElementById('form-login').style.display = 'block';
        }
    }

    async function fazerCadastro() {
        const nome = document.getElementById('cad-nome').value;
        const usuario = document.getElementById('cad-usuario').value;
        const senha = document.getElementById('cad-senha').value;

        const res = await fetch(`${API_URL}/motoboys/cadastrar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nome, usuario, senha })
        });
        const json = await res.json();
        if (res.ok) {
            alert(json.mensagem);
            alternarTelaAuth('login');
        } else {
            alert(json.erro);
        }
    }

    async function fazerLogin() {
        const usuario = document.getElementById('login-usuario').value;
        const senha = document.getElementById('login-senha').value;

        const res = await fetch(`${API_URL}/motoboys/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuario, senha })
        });
        const json = await res.json();
        if (res.ok) {
            motoboyLogado = json.motoboy;
            localStorage.setItem('motoboy_logado', JSON.stringify(motoboyLogado));
            verificarSessao();
        } else {
            alert(json.erro);
        }
    }

    function fazerLogout() {
        localStorage.removeItem('motoboy_logado');
        motoboyLogado = null;
        pararAlarmeSonoro();
        location.reload();
    }

    function ativarAppCompleto() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (window.Notification && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
            document.getElementById('aviso-audio').style.display = 'none';
            tocarAlarmeAgitado();
            alert("App ativado com sucesso!");
        } catch (e) {
            console.log("Erro áudio:", e);
        }
    }

    function dispararNotificacaoNativa(cliente, ganho) {
        if (window.Notification && Notification.permission === "granted") {
            new Notification("🚨 Nova Entrega Disponível!", {
                body: `Cliente: ${cliente} | Ganho: R$ ${ganho}`,
                icon: "https://cdn-icons-png.flaticon.com/512/3076/3076129.png"
            });
        }
    }

    function tocarAlarmeAgitado() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const agora = audioCtx.currentTime;

            let osc1 = audioCtx.createOscillator();
            let gain1 = audioCtx.createGain();
            osc1.type = 'triangle';
            osc1.frequency.setValueAtTime(950, agora);
            gain1.gain.setValueAtTime(0.3, agora);
            gain1.gain.exponentialRampToValueAtTime(0.01, agora + 0.15);
            osc1.connect(gain1); gain1.connect(audioCtx.destination);
            osc1.start(agora); osc1.stop(agora + 0.15);

            let osc2 = audioCtx.createOscillator();
            let gain2 = audioCtx.createGain();
            osc2.type = 'square';
            osc2.frequency.setValueAtTime(1400, agora + 0.18);
            gain2.gain.setValueAtTime(0.3, agora + 0.18);
            gain2.gain.exponentialRampToValueAtTime(0.01, agora + 0.35);
            osc2.connect(gain2); gain2.connect(audioCtx.destination);
            osc2.start(agora + 0.18); osc2.stop(agora + 0.35);
        } catch (e) {
            console.log("Áudio bloqueado.", e);
        }
    }

    function iniciarAlarmeSonoro(cliente, ganho, idPedido) {
        if (!audioInterval) {
            tocarAlarmeAgitado();
            audioInterval = setInterval(tocarAlarmeAgitado, 1200);
        }
        if (ultimoPedidoNotificado !== idPedido) {
            ultimoPedidoNotificado = idPedido;
            dispararNotificacaoNativa(cliente, ganho.toFixed(2));
        }
    }

    function pararAlarmeSonoro() {
        if (audioInterval) {
            clearInterval(audioInterval);
            audioInterval = null;
        }
        ultimoPedidoNotificado = null;
    }

    async function atualizarPainelMotoboy() {
        if (!motoboyLogado) return;

        const activeInput = document.activeElement;
        const activeInputId = activeInput && activeInput.tagName === 'INPUT' ? activeInput.id : null;
        const activeInputValue = activeInput && activeInput.tagName === 'INPUT' ? activeInput.value : '';

        const res = await fetch(`${API_URL}/pedidos`);
        const pedidos = await res.json();
        
        let htmlMotoboy = '';
        let temPedidoDisponivel = false;
        let idPedidoAtual = null;
        let clienteAtual = '';
        let ganhoAtual = 0;
        let saldoAcumulado = 0;

        pedidos.forEach(p => {
            // Calcula o saldo somando apenas as entregas concluídas deste motoboy específico
            if (p.status === 'Entregue' && p.motoboyId === motoboyLogado.id) {
                saldoAcumulado += p.financeiro.taxaEntrega;
            }

            if (p.status === 'Disponível') {
                temPedidoDisponivel = true;
                idPedidoAtual = p.id;
                clienteAtual = p.cliente;
                ganhoAtual = p.financeiro.taxaEntrega;

                htmlMotoboy += `
                    <div class="card card-alerta">
                        <span class="badge">NOVA ENTREGA!</span>
                        <p><strong>Cliente:</strong> ${p.cliente}</p>
                        <p><strong>Endereço de Entrega:</strong> <span style="color:#ffcc00;">${p.entrega.enderecoCliente}</span></p>
                        <p><strong>Distância:</strong> ${p.entrega.distanciaKm} km</p>
                        <p><strong>Ganho:</strong> <span style="color:#4CAF50; font-weight:bold; font-size: 1.2rem;">R$ ${p.financeiro.taxaEntrega.toFixed(2)}</span></p>
                        <button class="btn-aceitar" onclick="aceitarPedido(${p.id})">ACEITAR ENTREGA</button>
                        <button class="btn-recusar" onclick="recusarPedido(${p.id})">RECUSAR</button>
                    </div>
                `;
            } else if (p.status === 'Aguardando Coleta' && p.motoboyId === motoboyLogado.id) {
                htmlMotoboy += `
                    <div class="card">
                        <span class="badge" style="background:#ff9800">VÁ AO RESTAURANTE</span>
                        <p><strong>Pedido #${p.id}</strong> - Cliente: <strong style="color:#ffcc00;">${p.cliente}</strong></p>
                        <p>📍 Destino: <strong>${p.entrega.enderecoCliente}</strong></p>
                        <p>📍 Retirada: ${p.retirada.endereco}</p>
                        <p>💰 <strong>Ganho:</strong> <span style="color:#4CAF50;">R$ ${p.financeiro.taxaEntrega.toFixed(2)}</span></p>
                        <input type="text" id="codigo-coleta-${p.id}" placeholder="Código de Coleta do Restaurante">
                        <button onclick="coletarPedido(${p.id})">Confirmar Coleta</button>
                        <button class="btn-recusar" onclick="recusarPedido(${p.id})" style="margin-top:5px;">Cancelar Corrida</button>
                    </div>
                `;
            } else if (p.status === 'Em Trânsito' && p.motoboyId === motoboyLogado.id) {
                htmlMotoboy += `
                    <div class="card">
                        <span class="badge" style="background:#2196F3">EM ROTA DE ENTREGA</span>
                        <p>👤 <strong>Cliente:</strong> <span style="color:#4CAF50; font-size: 1.1rem;">${p.cliente}</span></p>
                        <p>📍 <strong>Destino:</strong> ${p.entrega.enderecoCliente}</p>
                        <p>💰 <strong>Ganho:</strong> <span style="color:#4CAF50; font-weight:bold; font-size: 1.1rem;">R$ ${p.financeiro.taxaEntrega.toFixed(2)}</span></p>
                        <p style="font-size: 0.85rem; color: #888;">(Peça o código de 4 dígitos diretamente ao cliente)</p>
                        <input type="text" id="codigo-entrega-${p.id}" placeholder="Digite o Código do Cliente">
                        <button onclick="entregarPedido(${p.id})" style="background-color: #8bc34a;">Concluir Entrega</button>
                    </div>
                `;
            }
        });

        document.getElementById('saldo-total').innerText = `R$ ${saldoAcumulado.toFixed(2)}`;

        if (temPedidoDisponivel) {
            iniciarAlarmeSonoro(clienteAtual, ganhoAtual, idPedidoAtual);
        } else {
            pararAlarmeSonoro();
            if (!htmlMotoboy) htmlMotoboy = "<p style='color:#777; text-align:center;'>Nenhuma entrega ativa no momento.</p>";
        }

        document.getElementById('motoboy-painel').innerHTML = htmlMotoboy;

        if (activeInputId) {
            const restoredInput = document.getElementById(activeInputId);
            if (restoredInput) {
                restoredInput.value = activeInputValue;
                restoredInput.focus();
            }
        }
    }

    async function aceitarPedido(id) {
        pararAlarmeSonoro();
        const res = await fetch(`${API_URL}/pedidos/${id}/aceitar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ motoboyId: motoboyLogado.id, motoboyNome: motoboyLogado.nome })
        });
        const json = await res.json();
        if (!res.ok) alert(json.erro);
        atualizarPainelMotoboy();
    }

    async function recusarPedido(id) {
        pararAlarmes();
        await fetch(`${API_URL}/pedidos/${id}/recusar`, { method: 'POST' });
        atualizarPainelMotoboy();
    }
    function pararAlarmes() { pararAlarmeSonoro(); }

    async function coletarPedido(id) {
        const inputElem = document.getElementById(`codigo-coleta-${id}`);
        const codigoColeta = inputElem ? inputElem.value : '';
        const res = await fetch(`${API_URL}/pedidos/${id}/coletar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ codigoColeta })
        });
        const json = await res.json();
        if (res.ok) { alert(json.mensagem); atualizarPainelMotoboy(); }
        else { alert(json.erro); }
    }

    async function entregarPedido(id) {
        const inputElem = document.getElementById(`codigo-entrega-${id}`);
        const codigoEntrega = inputElem ? inputElem.value : '';
        const res = await fetch(`${API_URL}/pedidos/${id}/entregar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ codigoEntrega })
        });
        const json = await res.json();
        if (res.ok) { alert(json.mensagem); atualizarPainelMotoboy(); }
        else { alert(json.erro); }
    }

    async function abrirHistorico() {
        const res = await fetch(`${API_URL}/pedidos`);
        const pedidos = await res.json();
        const entregues = pedidos.filter(p => p.status === 'Entregue' && p.motoboyId === motoboyLogado.id);

        let html = '';
        if (entregues.length === 0) {
            html = '<p style="color:#777; text-align:center;">Nenhuma entrega concluída por você ainda.</p>';
        } else {
            entregues.forEach(p => {
                html += `
                    <div style="background:#252525; padding: 10px; margin-bottom: 8px; border-radius: 6px; border-left: 4px solid #4CAF50;">
                        <p style="margin:0 0 5px 0;"><strong>Pedido #${p.id}</strong> - ${p.cliente}</p>
                        <p style="margin:0 0 5px 0; font-size:0.9rem; color:#aaa;">📍 ${p.entrega.enderecoCliente}</p>
                        <p style="margin:0; color:#4CAF50; font-weight:bold;">Ganho: R$ ${p.financeiro.taxaEntrega.toFixed(2)}</p>
                    </div>
                `;
            });
        }

        document.getElementById('lista-historico').innerHTML = html;
        document.getElementById('modal-historico').style.display = 'flex';
    }

    function fecharHistorico() {
        document.getElementById('modal-historico').style.display = 'none';
    }

    function iniciarLoopApp() {
        setInterval(atualizarPainelMotoboy, 3000);
        atualizarPainelMotoboy();
    }

    verificarSessao();
</script>

</body>
</html>
