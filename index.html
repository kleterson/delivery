<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App do Motoboy</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; background: #1e1e1e; padding: 20px; border-radius: 12px; }
        h1 { font-size: 1.3rem; color: #ff5252; text-align: center; }
        button { padding: 12px; margin: 8px 0; width: 100%; border-radius: 6px; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .btn-vermelho { background-color: #ff5252; color: white; }
        .btn-verde { background-color: #4CAF50; color: white; }
        .oculto { display: none !important; }
        #map { width: 100%; height: 200px; border-radius: 8px; margin: 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <div id="tela-login">
        <h1>🍔 Login do Motoboy</h1>
        <input type="text" id="login-usuario" placeholder="Usuário" style="width:100%; padding:12px; margin:8px 0; background:#2d2d2d; border:1px solid #444; color:#fff; border-radius:6px;">
        <input type="password" id="login-senha" placeholder="Senha" style="width:100%; padding:12px; margin:8px 0; background:#2d2d2d; border:1px solid #444; color:#fff; border-radius:6px;">
        <button class="btn-verde" onclick="fazerLogin()">Entrar</button>
    </div>

    <div id="tela-principal" class="oculto">
        <h1>🛵 App do Motoboy</h1>
        <p id="saudacao-usuario" style="text-align: center; color: #4CAF50;"></p>
        <button id="btn-conexao" class="btn-vermelho" onclick="alternarConexao()">🔴 OFFLINE</button>
        <div id="map"></div>
        <div id="area-pedidos"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const API_URL = window.location.origin;
    let motoboyLogado = null;
    let online = false;
    let map = null;

    async function fazerLogin() {
        const usuario = document.getElementById('login-usuario').value;
        const senha = document.getElementById('login-senha').value;
        const res = await fetch(`${API_URL}/motoboys/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuario, senha })
        });
        const json = await res.json();
        if (res.ok) {
            motoboyLogado = json.motoboy;
            document.getElementById('tela-login').classList.add('oculto');
            document.getElementById('tela-principal').classList.remove('oculto');
            document.getElementById('saudacao-usuario').innerText = `Olá, ${motoboyLogado.nome}`;
            if (!map) {
                map = L.map('map').setView([-23.5505, -46.6333], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.html').addTo(map);
            }
            setInterval(buscarPedidos, 3000);
        } else {
            alert(json.erro);
        }
    }

    async function alternarConexao() {
        online = !online;
        const btn = document.getElementById('btn-conexao');
        btn.className = online ? "btn-verde" : "btn-vermelho";
        btn.innerText = online ? "🟢 ONLINE" : "🔴 OFFLINE";
        await fetch(`${API_URL}/motoboys/${motoboyLogado.id}/status-conexao`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ online })
        });
    }

    async function buscarPedidos() {
        if (!motoboyLogado) return;
        const res = await fetch(`${API_URL}/pedidos`);
        const pedidos = await res.json();
        let html = '';
        pedidos.forEach(p => {
            if (p.motoboyId === motoboyLogado.id) {
                html += `
                    <div style="background:#2d2d2d; padding:10px; margin-top:10px; border-radius:6px;">
                        <p>Pedido #${p.id} - ${p.cliente}</p>
                        <p>Status: <strong>${p.status}</strong></p>
                        ${p.status === 'Aceito' ? `
                            <input type="text" id="coleta-${p.id}" placeholder="Código de Coleta" style="width:100%; padding:8px; margin-bottom:5px;">
                            <button class="btn-verde" onclick="coletar(${p.id})">Coletar</button>
                        ` : ''}
                        ${p.status === 'Em Trânsito' ? `
                            <input type="text" id="entrega-${p.id}" placeholder="Código de Entrega" style="width:100%; padding:8px; margin-bottom:5px;">
                            <button class="btn-verde" onclick="entregar(${p.id})">Finalizar</button>
                        ` : ''}
                    </div>
                `;
            } else if (p.status === 'Disponível' && online && !p.motoboyId) {
                html += `
                    <div style="background:#2d2d2d; padding:10px; margin-top:10px; border-radius:6px;">
                        <p>Disponível: #${p.id} - ${p.cliente}</p>
                        <button class="btn-verde" onclick="aceitar(${p.id})">Aceitar Corrida</button>
                    </div>
                `;
            }
        });
        document.getElementById('area-pedidos').innerHTML = html || '<p style="color:#777; text-align:center;">Nenhum pedido no momento.</p>';
    }

    async function aceitar(id) {
        await fetch(`${API_URL}/pedidos/${id}/aceitar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ motoboyId: motoboyLogado.id, motoboyNome: motoboyLogado.nome })
        });
        buscarPedidos();
    }

    async function coletar(id) {
        const codigoColeta = document.getElementById(`coleta-${id}`).value;
        await fetch(`${API_URL}/pedidos/${id}/coletar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ codigoColeta })
        });
        buscarPedidos();
    }

    async function entregar(id) {
        const codigoEntrega = document.getElementById(`entrega-${id}`).value;
        await fetch(`${API_URL}/pedidos/${id}/entregar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ codigoEntrega })
        });
        buscarPedidos();
    }
</script>

</body>
</html>
